<style>

.card { position: relative; height: 76px; border-radius: var(--r-m); background: var(--row); border: 1px solid var(--divider); content-visibility: auto; contain-intrinsic-size: auto 76px; transition: transform .14s var(--ease-out); will-change: auto; text-align: center; }
